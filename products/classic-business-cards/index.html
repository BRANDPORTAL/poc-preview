        return true;
      }
      function showPrompt() {
        document.getElementById('preview-loading').hidden = true;
        document.getElementById('preview-content').hidden = false;
        passwordInput.focus();
      }
      function setSubmitting(isSubmitting) {
        submitButton.disabled = isSubmitting;
        form.setAttribute('aria-busy', String(isSubmitting));
        submitLabel.textContent = isSubmitting ? 'Opening preview…' : 'Unlock preview';
      }

      window.addEventListener('load', async () => {
        const hashedPassword = readSessionKey();
        if (hashedPassword) {
          try {
            const result = await staticrypt.handleDecryptionOfPageFromHash(hashedPassword, false);
            if (openPreview(result)) return;
          } catch {}
          forgetSessionKey();
        }
        showPrompt();
      }, { once: true });

      passwordInput.addEventListener('input', () => {
        errorMessage.textContent = '';
        passwordInput.removeAttribute('aria-invalid');
      });
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (submitButton.disabled) return;
        errorMessage.textContent = '';
        setSubmitting(true);
        try {
          const result = await staticrypt.handleDecryptionOfPage(passwordInput.value, false);
          if (openPreview(result)) return;
          errorMessage.textContent = 'That password didn’t match. Please try again.';
          passwordInput.setAttribute('aria-invalid', 'true');
          passwordInput.focus();
          passwordInput.select();
        } catch {
          errorMessage.textContent = 'We couldn’t open the preview. Please try again in a current browser.';
        }
        setSubmitting(false);
      });
    })();
  </script>
</body>
</html>
